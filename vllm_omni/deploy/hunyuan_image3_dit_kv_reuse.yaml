# HunyuanImage-3.0-Instruct DiT-only deploy with external AR KV reuse.
#
# Use this when AR runs outside Omni (for example vLLM) and DiT runs as an
# Omni service. The DiT stage receives KV payloads from a local
# SharedMemoryConnector edge keyed by request id.
pipeline: hunyuan_image3_dit
async_chunk: false

connectors:
  shared_memory_connector:
    name: SharedMemoryConnector
    extra:
      shm_threshold_bytes: 65536

stages:
  - stage_id: 0
    max_num_seqs: 1
    gpu_memory_utilization: 0.9
    enforce_eager: true
    devices: "0,1,2,3"
    vae_use_slicing: false
    vae_use_tiling: false
    cache_backend:
    cache_config:
    enable_cache_dit_summary: false
    omni_kv_config:
      need_recv_cache: true
      recv_timeout: 30.0
    input_connectors:
      from_stage_0: shared_memory_connector
    parallel_config:
      pipeline_parallel_size: 1
      data_parallel_size: 1
      tensor_parallel_size: 4
      enable_expert_parallel: true
      sequence_parallel_size: 1
      ulysses_degree: 1
      ring_degree: 1
      cfg_parallel_size: 1
      vae_patch_parallel_size: 1
      use_hsdp: false
      hsdp_shard_size: -1
      hsdp_replicate_size: 1
    default_sampling_params:
      seed: 42
